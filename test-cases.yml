  test-data: |
    Типы соперников: случайный игрок, с другом, бот
  steps:
    - Выбрать тип соперника «Случайный игрок»
    - Проверить, что выбранный вариант визуально выделен
    - Выбрать тип соперника «С другом»
    - Проверить, что выбранный вариант визуально выделен
    - Выбрать тип соперника «Бот»
    - Проверить, что выбранный вариант визуально выделен
  expected-result: |
    Пользователь может переключаться между доступными типами соперников. Одновременно выбран только один уровень сложности. Выбранный уровень визуально отличается от остальных.

- summary: |
    Проверка изменения контроля времени при создании битвы 
  requirement: |
    Пользователь должен иметь возможность выбирать контроль времени битвы
  prerequisites: |
    Пользователь авторизован в системе
    Открыто окно «Создать битву»
  test-data: |
    Контроль времени: 8 минут
    Другие доступные значения времени, определяемые ползунком
  steps:
    - Изменить положение ползунка контроля времени
    - Проверить отображаемое значение времени
    - Переместить ползунок в другое положение
    - Проверить, что отображаемое значение времени изменилось
  expected-result: |
    При изменении положения ползунка отображается соответствующее значение времени. Отображаемое значение соответствует выбранному положению ползунка.
      
