functional:
- система должна позволять пользователю создать аккаунт с помощью электронной почты и пароля
- система должна позволять пользователю создать аккаунт с помощью авторизации через GitHub
- система должна позволять пользователю создать аккаунт с помощью авторизации через Discord
- система должна позволять пользователю выйти из аккаунта
- пользователь должен иметь возможность создать битву
- пользователь должен иметь возможность наблюдать за ходом активной битвы без участия в ней
- пользователь должен иметь возможность присоединиться к доступной битве
- пользователь должен иметь возможность запускать проверку решения
- пользователь должен иметь возможность писать и редактировать код в редакторе
- пользователь должен иметь возможность сдаться во время битвы
- пользователь должен иметь возможность сбросить написанный код
- пользователь должен иметь возможность обмениваться сообщениями в чате в битве
- пользователь должен иметь возможность обмениваться сообщениями в общем чате
- пользователь должен иметь возможность сменить язык интерфейса из списка доступных языков
- пользователь должен иметь возможность сменить тему интерфейса
- пользователь должен иметь возможность включать и выключать звуковые эффекты игры
- пользователь должен иметь возможность создать турнир

non-functional:
- сайт должен быть удобным на мобильном устройстве
- сайт должен быть безопасным и защищать данные пользователя
- сайт должен быть протестирован на совместимость с последними версиями браузеров
- сайт должен быть способен обрабатывать большое количество трафика
- сайт должен быть разработан с учетом удобства использования и оптимизирован для скорости работы

implicit:
- каждая созданная битва должна иметь уникальный идентификатор или ссылку для доступа к ней
- если один из участников сдаётся, система должна завершить битву и определить результат в соответствии с правилами игры
- система должна корректно обрабатывать ситуацию, когда один из участников теряет соединение во время битвы
- сброс кода одного участника не должен удалять код другого участника
- система должна сообщать пользователю о результатах проверки кода, включая ошибки компиляции или неуспешное прохождение тестов
- система не должна позволять создавать несколько аккаунтов с одним и тем же адресом электронной почты
- система должна сообщать пользователю об ошибке, если регистрация или авторизация не удалась
