 - summary: |
    Проверка выбора уровня сложности при создании битвы 
  requirement: |
    Пользователь должен иметь возможность выбрать уровень сложности битвы
  prerequisites: |
    Пользователь авторизован в системе
    Открыто окно «Создать битву»
  test-data: |
    Уровни сложности: начальный, лёгкий, средний, сложный
  steps:
    - Выбрать уровень «начальный»
    - Проверить, что выбранный уровень визуально выделен
    - Выбрать уровень «Лёгкий»
    - Проверить, что выбранный уровень визуально выделен
    - Выбрать уровень «Средний»
    - Проверить, что уровень «Средний» выделен, а уровень «Лёгкий» больше не выделен
    - Выбрать уровень «Сложный»
    - Проверить, что выбранный уровень визуально выделен
  expected-result: |
    Пользователь может выбирать все доступные уровни сложности. Одновременно выбран только один уровень сложности. Выбранный уровень визуально отличается от остальных.

 - summary: |
