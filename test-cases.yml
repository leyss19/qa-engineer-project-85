- summary: |
    Проверка выбора уровня сложности при создании битвы 
  requirement: |
    Пользователь должен иметь возможность выбрать уровень сложности битвы
  prerequisites: |
    Пользователь авторизован в системе
    Открыто окно «Создать битву»
  test-data: |
    Уровни сложности: начальный, лёгкий, средний, сложный
  steps:
    - Выбрать уровень «начальный»
    - Проверить, что выбранный уровень визуально выделен
    - Выбрать уровень «Лёгкий»
    - Проверить, что выбранный уровень визуально выделен
    - Выбрать уровень «Средний»
    - Проверить, что уровень «Средний» выделен, а уровень «Лёгкий» больше не выделен
    - Выбрать уровень «Сложный»
    - Проверить, что выбранный уровень визуально выделен
  expected-result: |
    Пользователь может выбирать все доступные уровни сложности. Одновременно выбран только один уровень сложности. Выбранный уровень визуально отличается от остальных

- summary: |
    Проверка выбора типа соперника при создании битвы 
  requirement: |
    Пользователь должен иметь возможность выбрать тип соперника
  prerequisites: |
    Пользователь авторизован в системе
    Открыто окно «Создать битву»
  test-data: |
    Типы соперников: случайный игрок, с другом, бот
  steps:
    - Выбрать тип соперника «Случайный игрок»
    - Проверить, что выбранный вариант визуально выделен
    - Выбрать тип соперника «С другом»
    - Проверить, что выбранный вариант визуально выделен
    - Выбрать тип соперника «Бот»
    - Проверить, что выбранный вариант визуально выделен
  expected-result: |
    Пользователь может переключаться между доступными типами соперников. Одновременно выбран только один уровень сложности. Выбранный уровень визуально отличается от остальных

- summary: |
    Проверка изменения контроля времени при создании битвы 
  requirement: |
    Пользователь должен иметь возможность выбирать контроль времени битвы
  prerequisites: |
    Пользователь авторизован в системе
    Открыто окно «Создать битву»
  test-data: |
    Контроль времени: 8 минут
    Другие доступные значения времени, определяемые ползунком
  steps:
    - Изменить положение ползунка контроля времени
    - Проверить отображаемое значение времени
    - Переместить ползунок в другое положение
    - Проверить, что отображаемое значение времени изменилось
  expected-result: |
    При изменении положения ползунка отображается соответствующее значение времени. Отображаемое значение соответствует выбранному положению ползунка

- summary: |
    Проверка выбора категории и задачи при создании битвы
  requirement: |
    Пользователь должен иметь возможность выбирать категорию и задачу для битвы
  prerequisites: |
    Пользователь авторизован в системе
    Открыто окно «Создать битву» 
  test-data: |
    Категории: string, math, collections, rest
  steps:
    - Выбрать категорию «strings»
    - Открыть список задач
    - Проверить доступность выбора задачи
    - Выбрать задачу
    - Проверить, что выбранная задача отображается в поле задачи
  expected-result: |
    Пользователь может выбрать категорию и доступную задачу. Выбранная задача отображается в поле задачи

- summary: |
    Проверка успешного создания битвы с выбранными настройками
  requirement: |
    Пользователь должен иметь возможность создать битву с выбранными параметрами
  prerequisites: |
    Пользователь авторизован в системе
    Открыто окно «Создать битву» 
  test-data: |
    Уровень сложности: Начальный Тип соперника: Бот Контроль времени: 8 минут Категория задачи: strings Задача: случайная задача из выбранной категории
  steps:
    - Выбрать уровень сложности «Начальный»
    - Выбрать тип соперника «Бот»
    - Установить контроль времени на 8 минут
    - Выбрать категорию «strings»
    - Выбрать случайную задачу из доступных
    - Нажать кнопку «Создать битву
  expected-result: |
    Пользователь перенаправляется на страницу созданной битвы. Созданная битва соответствует выбранным настройкам

- summary: |
    Проверка возможности просоединиться к доступной битве
  requirement: |
    Пользователь должен иметь возможность присоединиться к битве
  prerequisites: |
    Пользователь авторизован в системе
    Существует доступная битва, к которой можно присоединиться
    Открыта главная страница 
  test-data: |
    Доступная битва: 4
  steps:
    - Нажать кнопку «Присоединиться»
    - Нажать кнопку «Сражаться» напротив любой из доступных битв
  expected-result: |
    Пользователь успешно присоединяется к доступной битве. Открывается страница битвы с заданием и игровым редактором

- summary: |
    Проверка возможности запустить проверку решения
  requirement: |
    Пользователь должен иметь возможность запускать проверку своего решения
  prerequisites: |
    Пользователь авторизован в системе
    Пользователь находится на странице активной битвы
    В редакторе кода введено решение задачи 
  test-data: |
    Решение: корректное решение текущей задачи
  steps:
    - Ввести решение задачи в редактор кода
    - Нажать кнопку «Запустить»
  expected-result: |
    Система запускает проверку решения. Пользователь видит результат проверки. Отображается информация об успешном прохождении тестов или об обнаруженных ошибках

- summary: |
    Проверка возможности наблюдать за ходом активной битвы
  requirement: |
    Система должна предоставлять пользователю возможность наблюдать за ходом активной битвы без участия в ней
  prerequisites: |
    Пользователь авторизован в системе
    Существует активная битва между двумя игроками
  test-data: |
    Статус битвы: Активная
  steps:
    - Нажать кнопку «Присоединиться»
    - Нажать кнопку «Смотреть» из доступных активных битв
  expected-result: |
    Пользователь успешно открывает битву в режиме наблюдения. Система отображает текущий ход битвы. Пользователь может наблюдать за процессом, не становясь участником битвы

- summary: |
    Проверка возможности писать и редактировать код в редакторе
  requirement: |
    Пользователь должен иметь возможность писать и редактировать код в редакторе
  prerequisites: |
    Пользователь авторизован в системе
    Пользователь находится на странице активной битвы
  test-data: |
    Язык программирования: Python
    Исходный код: "print("Hello, world!")"
    Изменённый код: "print("Hello, Codebattle!")"
  steps:
    - Выбрать язык программирования Python
    - Ввести в редактор исходный код: "print("Hello, world!")"
    - Проверить, что введённый код отображается в редакторе
    - Изменить исходный код на: "print("Hello, Codebattle!")"
    - Проверить, что редактор отображает изменённый код
  expected-result: |
    Пользователь может вводить код в редактор. Введённый код отображается корректно. Пользователь может изменять и удалять ранее введённый код. После редактирования в редакторе отображается актуальная версия кода

